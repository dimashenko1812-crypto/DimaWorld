<!DOCTYPE html>
<html lang="uk" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Сторінку не знайдено · DimaWorld</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('dw_theme')||'dark')}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=Rubik:wght@400;500&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">

<body class="err-body">
  <canvas id="err-canvas" aria-hidden="true"></canvas>
  <div class="err-vignette" aria-hidden="true"></div>
  <div class="err-content">
    <div class="err-code">404</div>
    <h1 class="err-title">ОЙ!</h1>
    <p class="err-text">Цей блок загубився у світі DimaWorld. Схоже, сторінка, яку ти шукаєш, була зруйнована кріпером або ніколи не існувала.</p>
    <div class="err-actions">
      <a href="index.html" class="btn btn--primary">ПОВЕРНУТИСЯ НА ГОЛОВНУ</a>
      <a href="index.html#status" class="btn btn--ghost">🟢 СТАТУС СЕРВЕРА</a>
    </div>
    <div class="err-status">
      <span class="chip chip--green"><span class="dot dot--pulse"></span> Сервер працює · play.dimaworld.com</span>
    </div>
  </div>
  <div class="err-footer">DIMAWORLD · DEMO ERROR PAGE</div>
  <script src="js/errors.js" defer></script>

</html>
